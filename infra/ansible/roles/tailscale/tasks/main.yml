---
# Tailscale — accès admin distant (SSH + dashboards *arr*) sans exposer de
# port. Voir docs/adr/015-tailscale.md.
#
# L'installation est idempotente (ne refait rien si déjà en place). La
# connexion au tailnet (`tailscale up`) n'a lieu que si le nœud n'est pas
# encore "Running" ET qu'une clé d'auth est fournie en extra-var :
#   ansible-playbook playbooks/site.yml --ask-become-pass -e tailscale_authkey=tskey-auth-...
# La clé ne transite jamais par Git ni par l'inventaire — voir
# docs/runbooks/setup-tailscale.md.

- name: Vérifier si Tailscale est déjà installé
  ansible.builtin.command: tailscale version
  register: tailscale_check
  changed_when: false
  failed_when: false

- name: Télécharger la clé GPG du dépôt Tailscale
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  when: tailscale_check.rc != 0

- name: Ajouter le dépôt apt Tailscale
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
  when: tailscale_check.rc != 0

- name: Installer Tailscale
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: tailscale_check.rc != 0

- name: Activer et démarrer tailscaled
  become: true
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: État de la connexion au tailnet
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Connecter au tailnet (première fois — clé fournie en extra-var)
  become: true
  ansible.builtin.command: >-
    tailscale up
    --ssh
    --hostname=nucbox
    --auth-key={{ tailscale_authkey }}
    {% if tailscale_advertise_routes | length > 0 %}--advertise-routes={{ tailscale_advertise_routes }}{% endif %}
  when:
    - tailscale_authkey is defined and tailscale_authkey | length > 0
    - tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != 'Running'
  # La commande contient la clé : ne pas l'afficher dans les logs.
  no_log: true

- name: Rappel si le nœud n'est pas connecté et qu'aucune clé n'est fournie
  ansible.builtin.debug:
    msg: >-
      Tailscale installé mais nœud non connecté. Relancer avec
      « -e tailscale_authkey=tskey-auth-... » (voir docs/runbooks/setup-tailscale.md).
  when:
    - tailscale_authkey is not defined or tailscale_authkey | length == 0
    - tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != 'Running'
