---
# Docker Engine via le dépôt officiel (pas le snap, voir CHANGELOG
# 2026-08-27) — idempotent, ne réinstalle rien si déjà en place.

- name: Vérifier si Docker est déjà installé
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Installer les prérequis
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  when: docker_check.rc != 0

- name: Créer le dossier des clés apt
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: docker_check.rc != 0

- name: Télécharger la clé GPG officielle Docker
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: docker_check.rc != 0

- name: Ajouter le dépôt apt Docker
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  when: docker_check.rc != 0

- name: Installer Docker Engine
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
    state: present
    update_cache: true
  when: docker_check.rc != 0

- name: Ajouter kong au groupe docker
  become: true
  ansible.builtin.user:
    name: kong
    groups: docker
    append: true
