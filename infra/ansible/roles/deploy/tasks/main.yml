---
# Déploie le code (compose, bot, scripts) — jamais les secrets (.env), qui
# n'existent que sur le serveur et ne transitent jamais par le repo Git ni
# par ce playbook. Voir chaque runbook (setup-*.md) pour la création
# manuelle des .env, étape volontairement hors Ansible pour l'instant.

- name: Créer la structure de dossiers sur le NucBox
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /home/kong/blackbox/prod
    - /home/kong/blackbox/prod/traefik
    - /home/kong/blackbox/prod/crowdsec
    - /home/kong/blackbox/bot
    - /home/kong/blackbox/scripts/gluetun-healthcheck
    - /home/kong/blackbox/scripts/backup

- name: Déployer docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/prod/docker-compose.yml"
    dest: /home/kong/blackbox/prod/docker-compose.yml
    mode: "0644"
  notify: docker compose up

- name: Déployer la config Traefik + CrowdSec (hors lapi-key, secret manuel)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../docker/prod/{{ item }}"
    dest: "/home/kong/blackbox/prod/{{ item }}"
    mode: "0644"
  loop:
    - traefik/traefik.yml
    - traefik/dynamic.yml
    - crowdsec/acquis.yaml
  notify: docker compose up

# CrowdSec démarre avant Traefik (traefik depends_on crowdsec) : l'access.log
# n'existe pas encore et la source d'acquisition serait abandonnée. On le
# pré-crée pour que la source Traefik soit toujours prise au démarrage.
- name: Pré-créer l'access.log Traefik (lu par CrowdSec au démarrage)
  ansible.builtin.file:
    path: /home/kong/blackbox/prod/data/traefik/logs/access.log
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve

# Le code du bot n'est plus déployé ici : l'image est construite et poussée
# sur GHCR par GitHub Actions puis tirée par `docker compose pull`. Seul le
# .env du bot reste sur le NucBox (créé manuellement). Voir
# docs/adr/013-cicd-github-actions.md.

- name: Déployer le script gluetun-healthcheck (hors .env)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/gluetun-healthcheck/check-gluetun.sh"
    dest: /home/kong/blackbox/scripts/gluetun-healthcheck/check-gluetun.sh
    mode: "0755"

- name: Déployer le script de backup (hors .env)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/backup/backup.sh"
    dest: /home/kong/blackbox/scripts/backup/backup.sh
    mode: "0755"

- name: Vérifier la présence des secrets requis
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /home/kong/blackbox/prod/.env
    - /home/kong/blackbox/prod/traefik/lapi-key
    - /home/kong/blackbox/bot/.env
    - /home/kong/blackbox/scripts/gluetun-healthcheck/.env
    - /home/kong/blackbox/scripts/backup/.env
  register: env_files

- name: Avertir si des secrets manquent (création manuelle requise, voir runbooks)
  ansible.builtin.debug:
    msg: >-
      {{ item.item }} est absent — le créer manuellement avant de relancer
      (voir le runbook correspondant), ce playbook ne gère jamais les secrets.
  loop: "{{ env_files.results }}"
  when: not item.stat.exists
