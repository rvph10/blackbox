[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = kong
host_key_checking = True
retry_files_enabled = False

[privilege_escalation]
become = True
become_method = sudo
# Flag par défaut d'Ansible (-H -S -n) : le -n force sudo en mode
# non-interactif, ce qui empêche le prompt mot de passe d'apparaître et
# fait échouer --ask-become-pass avec un "Timeout waiting for privilege
# escalation prompt". On retire -n pour permettre le prompt interactif.
become_flags = -H -S

[ssh_connection]
# Le multiplexage SSH (ControlMaster/ControlPersist, activé par défaut par
# Ansible) empêche l'allocation correcte d'un pseudo-terminal sur la tâche
# sudo interactive (-tt), qui reste bloquée en silence jusqu'au timeout de
# privilege escalation. Désactivé pour permettre le prompt mot de passe.
ssh_args = -o ControlMaster=no -o ControlPersist=no
