name: blackbox/whitelists
description: >
  Faux positifs propres à Blackbox. Le plugin Jellyfin "Home Screen Sections"
  (ADR-023) sert chaque affiche via une URL sans extension
  (/HomeScreen/CachedImage/<hash>) ; une home modulaire = 50+ de ces requêtes
  d'un coup → crowdsecurity/http-crawl-non_statics bannit à tort tout membre
  qui ouvre l'accueil.
filter: "evt.Meta.service == 'http' && evt.Meta.log_type in ['http_access-log', 'http_error-log']"
whitelist:
  reason: "endpoints first-party du plugin Home Screen Sections"
  expression:
    - "evt.Meta.http_path startsWith '/HomeScreen/'"
