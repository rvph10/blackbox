services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_PATH}:/media
    tmpfs:
      # Dossier temporaire de transcodage en RAM plutôt que sur le SSD :
      # moins de latence, moins d'usure disque. À pointer depuis Dashboard
      # -> Playback -> Transcoding -> Transcoding temporary path.
      - /transcodes:size=4g
    devices:
      - /dev/dri:/dev/dri
    # GID hôte des groupes video/render, pour l'accès à /dev/dri sans
    # dépendre du mapping utilisateur/groupe interne à l'image.
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    environment:
      - TZ=${TZ}
