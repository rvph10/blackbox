[project]
name = "blackbox-bot"
version = "0.1.0"
description = "Bot Discord Blackbox — Layer 2, commandes de statut en lecture seule"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (longueur de ligne) est laissé au formateur ; il n'enroule pas les
# chaînes littérales et on ne veut pas les couper à la main.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
