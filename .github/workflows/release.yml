name: Build & deploy bot

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/release.yml"

concurrency:
  group: release-bot
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rvph10/blackbox-bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: bot
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, nucbox]
    steps:
      - uses: actions/checkout@v4

      - name: Synchroniser le docker-compose déployé
        run: cp infra/docker/prod/docker-compose.yml "$HOME/blackbox/prod/docker-compose.yml"

      - name: Pull de l'image et redémarrage du bot
        run: |
          cd "$HOME/blackbox/prod"
          docker compose pull bot
          docker compose up -d bot
          docker image prune -f
