name: CI bot

on:
  pull_request:
    paths:
      - "bot/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pytest
        run: pytest -q
